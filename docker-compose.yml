version: "3.9"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: agrisense-mqtt-broker
    ports:
      - "1883:1883"
    restart: unless-stopped

  cloud-ingestion:
    build: ./src/cloud-ingestion
    container_name: agrisense-cloud-ingestion
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    ports:
      - "8081:8081"
    restart: unless-stopped

  device-shadow-svc:
    build: ./src/device-shadow-svc
    container_name: agrisense-device-shadow-svc
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    ports:
      - "8082:8082"
    restart: unless-stopped

  edge-gateway:
    build: ./src/edge-gateway
    container_name: agrisense-edge-gateway
    depends_on:
      - mqtt-broker
      - cloud-ingestion
    environment:
      - CLOUD_MQTT_HOST=mqtt-broker
      - CLOUD_MQTT_PORT=1883
      - SQLITE_BUFFER_PATH=/data/buffer.db
    restart: unless-stopped

  sensor-simulator:
    build: ./src/sensor-simulator
    container_name: agrisense-sensor-simulator
    depends_on:
      - edge-gateway
    environment:
      - SENSOR_COUNT=1000
      - TARGET_GATEWAY=edge-gateway
    restart: unless-stopped

  dashboard-ui:
    build: ./src/dashboard-ui
    container_name: agrisense-dashboard-ui
    depends_on:
      - device-shadow-svc
      - cloud-ingestion
    ports:
      - "3000:3000"
    restart: unless-stopped
